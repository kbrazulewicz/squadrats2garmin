[project]
name = "Squadrats2Garmin"
version = "0.2.6"
description = "Squadrats2Garmin project is a set of tools that improves the experience of _Squadrats_ collectors who use Garmin bike computers and smartwatches."
readme = "README.md"
authors = [
    { name = "Krystian Brazulewicz", email = "krystian@brazulewicz.pl" }
]
license = "GPL-3.0-only"
keywords = ["squadrats"]
requires-python = ">=3.11"
dependencies = [
    "fastkml>=1.4.0",
    "overpy>=0.7",
    "pycountry>=26.2.16",
    "requests>=2.34.2",
    "shapely==2.2.0",
]

[project.scripts]
visited = "squadrats2garmin:visited_squadrats"
grid = "squadrats2garmin:squadrats_grid"
poly = "squadrats2garmin:poly_download"

[build-system]
requires = ["uv_build>=0.13.0,<0.14"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "parameterized>=0.9.0",
    "pytest>=9.1.1",
    "pytest-benchmark>=5.3.0",
]

[tool.uv]
required-environments = [
  "sys_platform == 'linux' and platform_machine == 'x86_64'",
  "sys_platform == 'linux' and platform_machine == 'aarch64'",
]

